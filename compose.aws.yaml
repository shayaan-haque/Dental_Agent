services:
  backend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/dental-agent-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: dental-backend
    env_file:
      - .env.aws
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/dental-agent-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: dental-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
