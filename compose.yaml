
services:
  backend:
    image: dental-agent-backend
    container_name: dental-backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: dental-agent-frontend
    container_name: dental-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
